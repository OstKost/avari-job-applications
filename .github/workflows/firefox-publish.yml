name: Publish Firefox add-on
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Successful Avari.Jobs release tag (vX.Y.Z)
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: firefox-amo
    concurrency:
      group: avari-firefox-store
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm ci
      - name: Validate deployed release
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft == false' | grep -qx true
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern deployed.json --dir /tmp/avari-deployed
          python3 -c 'import json,os; assert json.load(open("/tmp/avari-deployed/deployed.json"))["tag"] == os.environ["TAG"]'
          curl -fsS https://jobs.avari.dev/readyz
          curl -fsS https://jobs.avari.dev/release.json | python3 -c 'import json,os,sys; assert json.load(sys.stdin)["version"] == os.environ["TAG"][1:]'
      - name: Download release archive
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'avari-extension.zip' --pattern 'SHA256SUMS' --dir /tmp/avari-source
          cd /tmp/avari-source
          awk '$2 == "avari-extension.zip"' SHA256SUMS | sha256sum -c -
      - name: Package and validate Firefox extension
        env:
          AVARI_VERSION: ${{ inputs.tag }}
          FIREFOX_EXTENSION_ID: ${{ vars.FIREFOX_EXTENSION_ID || 'jobs@avari.dev' }}
        run: |
          export AVARI_VERSION="${AVARI_VERSION#v}"
          node scripts/package-firefox.mjs /tmp/avari-source/avari-extension.zip /tmp/firefox-unpacked
          node scripts/check-firefox.mjs /tmp/firefox-unpacked
          git archive --format=zip --output=/tmp/avari-extension-source.zip HEAD
          node scripts/firefox-metadata.mjs /tmp/firefox-metadata.json
      - name: Submit to Firefox Add-ons (AMO)
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          FIREFOX_EXTENSION_ID: ${{ vars.FIREFOX_EXTENSION_ID || 'jobs@avari.dev' }}
        run: |
          npx --yes web-ext@10.8.0 sign \
            --source-dir /tmp/firefox-unpacked \
            --channel listed \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET" \
            --amo-metadata /tmp/firefox-metadata.json \
            --upload-source-code /tmp/avari-extension-source.zip \
            --artifacts-dir /tmp/firefox-signed \
            --approval-timeout 0
      - uses: actions/upload-artifact@v4
        with:
          name: firefox-submission
          path: /tmp/firefox-signed
          if-no-files-found: ignore
