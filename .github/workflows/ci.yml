name: Verify and build
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          echo "AVARI_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "VITE_AVARI_DEFAULT_SERVER=https://jobs.avari.dev" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: node scripts/release-notes.mjs
      - run: python3 -m unittest discover -s tests/deploy -v
      - run: npm run generate:api
      - run: git diff --exit-code docs/openapi.json packages/shared/src/generated-api.ts
      - run: make build test
      - run: npx playwright install --with-deps chromium
      - run: AVARI_E2E=1 go test ./apps/server/internal/httpapi -run '^TestBrowser$' -count=1 -timeout 10m
      - run: docker build --build-arg "AVARI_VERSION=${AVARI_VERSION:-}" -t avari:ci .
      - run: make release
      - uses: actions/upload-artifact@v4
        with:
          name: avari-release
          path: |
            dist/*.zip
            dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results
          path: test-results
  release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    environment: production
    concurrency:
      group: avari-jobs-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: avari-release
          path: dist
      - name: Set image version
        id: version
        run: echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Verify release archive version
        run: |
          unzip -p dist/avari-extension.zip manifest.json | python3 -c 'import json,os,sys; assert json.load(sys.stdin)["version"] == os.environ["GITHUB_REF_NAME"][1:]'
          cd dist
          sha256sum *.zip *.tar.gz > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AVARI_VERSION="${GITHUB_REF_NAME#v}" node scripts/release-notes.mjs
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release download "$GITHUB_REF_NAME" --dir dist --clobber
            (cd dist && sha256sum -c SHA256SUMS)
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.tar.gz dist/SHA256SUMS --verify-tag --title "$GITHUB_REF_NAME" --notes-file dist/release-notes.md
          fi
      - name: Read existing image metadata
        id: existing
        run: |
          if test -f dist/deployment.json; then
            python3 - <<'PY'
          import json, os, re
          data = json.load(open('dist/deployment.json'))
          assert data['tag'] == os.environ['GITHUB_REF_NAME']
          assert data['commit'] == os.environ['GITHUB_SHA']
          assert re.fullmatch('sha256:[0-9a-f]{64}', data['digest'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('digest=' + data['digest'] + '\n')
          PY
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push image
        id: image
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/ostkost/avari-job-applications:${{ github.ref_name }}
          build-args: |
            AVARI_VERSION=${{ steps.version.outputs.number }}
            CHROME_STORE_URL=${{ vars.CHROME_STORE_URL }}
            GA_MEASUREMENT_ID=${{ vars.GA_MEASUREMENT_ID || 'G-HWYGMZR8ZY' }}
      - name: Record pinned image
        id: pinned
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.existing.outputs.digest || steps.image.outputs.digest }}
        run: |
          echo "digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
          if ! test -f dist/deployment.json; then
            python3 - <<'PY'
          import json, os
          with open('dist/deployment.json', 'w') as output:
              json.dump({'tag': os.environ['GITHUB_REF_NAME'], 'commit': os.environ['GITHUB_SHA'], 'digest': os.environ['IMAGE_DIGEST']}, output)
          PY
            gh release upload "$GITHUB_REF_NAME" dist/deployment.json
          fi
      - name: Deploy to VPS
        env:
          DEPLOY_KEY: ${{ secrets.AVARI_DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.AVARI_DEPLOY_HOST_KEY }}
          IMAGE_DIGEST: ${{ steps.pinned.outputs.digest }}
          GHCR_TOKEN: ${{ github.token }}
          AVARI_TELEGRAM_ENABLED: ${{ vars.AVARI_TELEGRAM_ENABLED || 'false' }}
          AVARI_TELEGRAM_DELIVERY_MODE: ${{ vars.AVARI_TELEGRAM_DELIVERY_MODE || 'webhook' }}
          AVARI_TELEGRAM_BOT_USERNAME: ${{ vars.AVARI_TELEGRAM_BOT_USERNAME || 'AvariJobsBot' }}
          AVARI_TELEGRAM_BOT_TOKEN: ${{ secrets.AVARI_TELEGRAM_BOT_TOKEN }}
          AVARI_TELEGRAM_WEBHOOK_SECRET: ${{ secrets.AVARI_TELEGRAM_WEBHOOK_SECRET }}
        run: |
          mkdir -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          python3 - <<'PY'
          import json, os, subprocess
          config = {'enabled': os.environ['AVARI_TELEGRAM_ENABLED'] == 'true', 'token': os.environ['AVARI_TELEGRAM_BOT_TOKEN'], 'username': os.environ['AVARI_TELEGRAM_BOT_USERNAME'], 'webhookSecret': os.environ['AVARI_TELEGRAM_WEBHOOK_SECRET'], 'deliveryMode': os.environ['AVARI_TELEGRAM_DELIVERY_MODE']}
          subprocess.run(['ssh', '-o', 'StrictHostKeyChecking=yes', 'avari-deploy@176.53.174.118', 'sudo', '-n', '/usr/local/sbin/avari-jobs-deploy', '--telegram-config'], input=json.dumps(config), text=True, check=True)
          PY
          printf '%s' "$GHCR_TOKEN" | ssh -o StrictHostKeyChecking=yes avari-deploy@176.53.174.118 sudo -n /usr/local/sbin/avari-jobs-deploy "$GITHUB_REF_NAME" "$IMAGE_DIGEST" "$GITHUB_ACTOR"
      - name: Check public site and blocked direct downloads
        run: |
          curl -fsS --retry 8 --retry-delay 3 https://jobs.avari.dev/readyz
          curl -fsS https://jobs.avari.dev/privacy.html | python3 -c 'import sys; html=sys.stdin.read(); assert "Privacy Policy" in html and "web@ostkost.ru" in html and "id=\"ru\"" in html and "id=\"en\"" in html'
          curl -fsS https://jobs.avari.dev/release.json | python3 -c 'import json,os,sys; assert json.load(sys.stdin)["version"] == os.environ["GITHUB_REF_NAME"][1:]'
          status=$(curl -s -o /dev/null -w "%{http_code}" https://jobs.avari.dev/downloads/avari-extension.zip)
          test "$status" = "404"
      - name: Verify Telegram delivery configuration and commands
        if: vars.AVARI_TELEGRAM_ENABLED == 'true'
        env:
          TELEGRAM_TOKEN: ${{ secrets.AVARI_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USERNAME: ${{ vars.AVARI_TELEGRAM_BOT_USERNAME || 'AvariJobsBot' }}
          TELEGRAM_DELIVERY_MODE: ${{ vars.AVARI_TELEGRAM_DELIVERY_MODE || 'webhook' }}
        run: |
          python3 - <<'PY'
          import json, os, sys, time, urllib.request
          def call(method):
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen('https://api.telegram.org/bot' + os.environ['TELEGRAM_TOKEN'] + '/' + method, timeout=20) as response:
                          result = json.load(response)
                      if not result.get('ok'): raise ValueError()
                      return result['result']
                  except Exception:
                      if attempt == 2: sys.exit('Telegram API check failed (credentials and request URL redacted)')
                      time.sleep(3)
          assert call('getMe')['username'] == os.environ['TELEGRAM_USERNAME'], 'Unexpected bot identity'
          expected_url = '' if os.environ['TELEGRAM_DELIVERY_MODE'] == 'polling' else 'https://jobs.avari.dev/api/v1/telegram/webhook'
          assert call('getWebhookInfo')['url'] == expected_url, 'Unexpected Telegram delivery configuration'
          required = {'start', 'help', 'add', 'search', 'today', 'week', 'settings', 'cancel'}
          request = urllib.request.Request('https://api.telegram.org/bot' + os.environ['TELEGRAM_TOKEN'] + '/getMyCommands', data=b'{"scope":{"type":"all_private_chats"}}', headers={'Content-Type': 'application/json'})
          try:
              with urllib.request.urlopen(request, timeout=20) as response: commands = json.load(response)
              assert commands.get('ok') and required <= {c['command'] for c in commands['result']}
          except Exception:
              sys.exit('Telegram command check failed (credentials and request URL redacted)')
          print('Telegram identity, delivery configuration and private-chat commands verified')
          PY
      - name: Record successful deployment
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.pinned.outputs.digest }}
        run: |
          python3 - <<'PY'
          import json, os
          with open('dist/deployed.json', 'w') as output:
              json.dump({'tag': os.environ['GITHUB_REF_NAME'], 'commit': os.environ['GITHUB_SHA'], 'digest': os.environ['IMAGE_DIGEST']}, output)
          PY
          gh release upload "$GITHUB_REF_NAME" dist/deployed.json --clobber
