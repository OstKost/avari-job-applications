name: Publish Chrome extension
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Successful Avari.Jobs release tag (vX.Y.Z)
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    # Temporarily paused: do not submit browser extensions, including manual runs.
    if: ${{ false }}
    runs-on: ubuntu-latest
    environment: chrome-web-store
    concurrency:
      group: avari-chrome-store
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Validate deployed release
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft == false' | grep -qx true
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern deployed.json --dir /tmp/avari-deployed
          python3 -c 'import json,os; assert json.load(open("/tmp/avari-deployed/deployed.json"))["tag"] == os.environ["TAG"]'
          curl -fsS https://jobs.avari.dev/readyz
          curl -fsS https://jobs.avari.dev/release.json | python3 -c 'import json,os,sys; assert json.load(sys.stdin)["version"] == os.environ["TAG"][1:]'
      - name: Download and check archive
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'avari-extension.zip' --pattern 'SHA256SUMS' --dir /tmp/avari-chrome
          cd /tmp/avari-chrome
          awk '$2 == "avari-extension.zip"' SHA256SUMS | sha256sum -c -
          unzip -p avari-extension.zip manifest.json | python3 -c 'import json,os,sys; assert json.load(sys.stdin)["version"] == os.environ["TAG"][1:]'
      - name: Obtain Chrome Web Store access token
        id: token
        env:
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          ACCESS_TOKEN=$(curl -fsS -X POST "https://oauth2.googleapis.com/token" \
            -d "client_id=${CLIENT_ID}" \
            -d "client_secret=${CLIENT_SECRET}" \
            -d "refresh_token=${REFRESH_TOKEN}" \
            -d "grant_type=refresh_token" | jq -r '.access_token')
          if [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" = "null" ]; then
            echo "Failed to obtain access token"
            exit 1
          fi
          echo "::add-mask::$ACCESS_TOKEN"
          echo "access_token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"
      - name: Submit to Chrome Web Store
        env:
          CHROME_ACCESS_TOKEN: ${{ steps.token.outputs.access_token }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
          TAG: ${{ inputs.tag }}
        run: node scripts/publish-chrome.mjs /tmp/avari-chrome/avari-extension.zip

