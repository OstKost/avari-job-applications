server {
    listen 80;
    server_name jobs.avari.dev;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://jobs.avari.dev$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name jobs.avari.dev;
    ssl_certificate /etc/letsencrypt/live/jobs.avari.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jobs.avari.dev/privkey.pem;
    location / {
        if (-f /opt/avari-jobs/maintenance) { return 503; }
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
