<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d111b" />
    <title>Avari.Jobs — журнал откликов на вакансии</title>
    <meta
      name="description"
      content="Avari.Jobs — персональный журнал для поиска работы. Отслеживайте отклики, этапы собеседований, контакты и задачи в одном месте с расширением для Chrome."
    />
    <meta
      name="keywords"
      content="avari jobs, поиск работы, трекер вакансий, отклики hh ru, job tracker, учет откликов, собеседования, расширение для браузера"
    />
    <meta name="author" content="Avari" />
    <link rel="canonical" href="https://jobs.avari.dev" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Avari.Jobs" />
    <meta
      property="og:title"
      content="Avari.Jobs — журнал откликов на вакансии"
    />
    <meta
      property="og:description"
      content="Персональный журнал для поиска работы. Отслеживайте отклики, этапы собеседований и задачи в одном месте."
    />
    <meta property="og:url" content="https://jobs.avari.dev" />
    <meta
      property="og:image"
      content="https://jobs.avari.dev/brand/og-image.png"
    />
    <meta property="og:locale" content="ru_RU" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Avari.Jobs — журнал откликов на вакансии"
    />
    <meta
      name="twitter:description"
      content="Персональный журнал для поиска работы. Отслеживайте отклики, этапы собеседований и задачи в одном месте."
    />
    <meta
      name="twitter:image"
      content="https://jobs.avari.dev/brand/og-image.png"
    />

    <!-- Schema.org JSON-LD -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Avari.Jobs",
        "url": "https://jobs.avari.dev",
        "description": "Персональный журнал для поиска работы и трекинга откликов",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "All",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "RUB"
        }
      }
    </script>

    <script>
      // Apply the saved palette before the first paint, including the loading screen.
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("avari-theme") === "light" ? "light" : "dark";
      } catch {}
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/icon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/icon-180.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
