<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d111b" />
    <script>
      // Apply the saved palette before the first paint, including the loading screen.
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("avari-theme") === "light" ? "light" : "dark";
      } catch {}
    </script>
    <title>Avari.Jobs — журнал откликов</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/icon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/icon-180.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
