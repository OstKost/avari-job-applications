<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Avari.Jobs — локальный сервис</title><link rel="stylesheet" href="style.css"></head><body><main><img src="icon.png" width="64" height="64" alt=""><h1>Локальный Avari.Jobs</h1><p id="status" role="status">Проверяем состояние…</p><p id="error" role="alert"></p><p>Адрес: <strong id="origin"></strong></p><div class="actions"><button id="open">Открыть Avari.Jobs</button><button id="retry">Перезапустить</button></div><hr><form id="port-form"><label>Порт локального сервера<input id="port" type="number" min="1024" max="65535" required></label><button>Сохранить порт и запустить</button></form><p>При смене порта обновите адрес сервера в расширении.</p><p>Данные: <span id="directory"></span></p><button id="data">Открыть каталог данных</button><p>При ошибке обновления сохраните этот каталог. Резервные копии находятся в папке backups, подробности ошибки — в server.log.</p><p><button id="quit">Завершить Avari.Jobs</button></p></main><script src="launcher.js"></script></body></html>
